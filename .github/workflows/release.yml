---
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Verify source
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

      - name: Verify release version
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          app_version="$(plutil -extract CFBundleShortVersionString raw macos/Info.plist)"
          app_build="$(plutil -extract CFBundleVersion raw macos/Info.plist)"
          test "$version" = "$cargo_version"
          test "$version" = "$app_version"
          test "$version" = "$app_build"

  build:
    needs: verify
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Build release artifacts
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(uname -m)" = "${{ matrix.arch }}"
          cargo build --release --locked
          mkdir -p dist/cli
          macos/build-app.sh dist/Stats.app target/release/stats

          ditto -c -k --sequesterRsrc --keepParent \
            dist/Stats.app "dist/Stats-${version}-macOS-${{ matrix.arch }}.zip"

          cp target/release/stats README.md LICENSE dist/cli/
          tar -C dist/cli -czf "dist/stats-${version}-macOS-${{ matrix.arch }}.tar.gz" \
            stats README.md LICENSE
          rm -rf dist/cli dist/Stats.app

          (cd dist && shasum -a 256 ./*.zip ./*.tar.gz > "SHA256SUMS-${{ matrix.arch }}")

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            dist/*.zip dist/*.tar.gz dist/SHA256SUMS-* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Stats $version"
